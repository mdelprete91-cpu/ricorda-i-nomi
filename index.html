<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ricorda i Nomi — Flashcard</title>
<style>
  :root{
    --bg:#f3f0e9;
    --panel:#ffffff;
    --ink:#2b2a27;
    --muted:#8a877f;
    --line:#e7e2d8;
    --accent:#e0643a;
    --accent-ink:#ffffff;
    --good:#3f9b6d;
    --warn:#d9a441;
    --shadow:0 18px 40px rgba(40,34,24,.14);
    --radius:22px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#17161c; --panel:#232128; --ink:#f2efe9; --muted:#9b978e;
      --line:#34313b; --accent:#f0754a; --shadow:0 18px 44px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(1200px 700px at 85% -10%, rgba(224,100,58,.10), transparent 60%),
      radial-gradient(900px 600px at -5% 110%, rgba(63,155,109,.10), transparent 55%),
      var(--bg);
    color:var(--ink);
    min-height:100%;
    display:flex;flex-direction:column;align-items:center;
    padding:22px 16px 40px;
  }
  header{width:100%;max-width:560px;text-align:center;margin-bottom:10px}
  h1{font-size:1.45rem;font-weight:800;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:.9rem;margin-top:3px}

  .bar{
    width:100%;max-width:560px;display:flex;align-items:center;gap:12px;
    margin:14px 0 4px;
  }
  .progress{flex:1;height:8px;background:var(--line);border-radius:999px;overflow:hidden}
  .progress>i{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .3s ease}
  .count{font-variant-numeric:tabular-nums;font-weight:700;font-size:.9rem;color:var(--muted);white-space:nowrap}

  .stats{width:100%;max-width:560px;display:flex;gap:8px;justify-content:center;margin:8px 0 16px;flex-wrap:wrap}
  .chip{
    font-size:.82rem;color:var(--muted);background:var(--panel);
    border:1px solid var(--line);padding:5px 12px;border-radius:999px;
    display:inline-flex;align-items:center;gap:6px;
  }
  .chip b{color:var(--ink)}
  .dot{width:8px;height:8px;border-radius:50%}
  .dot.g{background:var(--good)} .dot.w{background:var(--warn)}

  /* ---- CARD ---- */
  .stage{perspective:1600px;width:100%;max-width:360px;margin:6px auto 0}
  .card{
    position:relative;width:100%;aspect-ratio:3/4;
    transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.3,1);
    cursor:pointer;
  }
  .card.flipped{transform:rotateY(180deg)}
  .face{
    position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:var(--radius);overflow:hidden;background:var(--panel);
    border:1px solid var(--line);box-shadow:var(--shadow);
  }
  .front img{width:100%;height:100%;object-fit:cover;display:block}
  .front .hint{
    position:absolute;left:0;right:0;bottom:0;padding:26px 16px 14px;
    background:linear-gradient(to top,rgba(0,0,0,.6),transparent);
    color:#fff;text-align:center;font-size:.86rem;letter-spacing:.02em;
    font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.4);
  }
  .back{
    transform:rotateY(180deg);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;padding:24px;
    background:linear-gradient(160deg,var(--accent),#c24a26);color:#fff;text-align:center;
  }
  .back .who{font-size:.8rem;text-transform:uppercase;letter-spacing:.16em;opacity:.8}
  .back .name{font-size:2rem;font-weight:800;line-height:1.1;letter-spacing:-.02em}
  .back .thumb{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.7);box-shadow:0 8px 20px rgba(0,0,0,.25)}
  .back .num{font-size:.78rem;opacity:.75}

  /* ---- JUDGE buttons ---- */
  .judge{display:flex;gap:10px;max-width:360px;margin:16px auto 0;width:100%}
  .judge button{
    flex:1;border:none;border-radius:14px;padding:13px 10px;font-size:.95rem;font-weight:700;
    cursor:pointer;color:#fff;transition:transform .12s ease,filter .12s ease;
  }
  .judge .no{background:var(--warn)} .judge .yes{background:var(--good)}
  .judge button:active{transform:scale(.96)}
  .judge button:disabled{opacity:.4;cursor:default}

  /* ---- controls ---- */
  .controls{display:flex;gap:8px;max-width:360px;margin:12px auto 0;width:100%}
  .controls button{
    flex:1;background:var(--panel);color:var(--ink);border:1px solid var(--line);
    border-radius:12px;padding:11px 8px;font-size:.88rem;font-weight:600;cursor:pointer;
    transition:transform .12s ease,background .12s ease;
  }
  .controls button:active{transform:scale(.96)}
  .controls button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}

  .modes{display:flex;gap:6px;justify-content:center;margin:18px auto 0;flex-wrap:wrap}
  .modes button{
    background:transparent;border:1px solid var(--line);color:var(--muted);
    border-radius:999px;padding:7px 14px;font-size:.82rem;font-weight:600;cursor:pointer;
  }
  .modes button.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .reset{background:transparent;border:none;color:var(--muted);font-size:.8rem;text-decoration:underline;cursor:pointer;margin-top:14px}

  .kbd{color:var(--muted);font-size:.76rem;text-align:center;margin-top:16px;line-height:1.7}
  .kbd span{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-weight:600;color:var(--ink)}

  .empty{display:none;text-align:center;color:var(--muted);padding:40px 10px}
  .celebrate{color:var(--good);font-weight:700}
</style>
</head>
<body>
  <header>
    <h1>Ricorda i Nomi</h1>
    <div class="sub">Guarda la foto, prova a indovinare il nome, poi gira la carta.</div>
  </header>

  <div class="bar">
    <div class="count" id="position">1 / 100</div>
    <div class="progress"><i id="pbar"></i></div>
  </div>
  <div class="stats">
    <span class="chip"><span class="dot g"></span>So: <b id="known">0</b></span>
    <span class="chip"><span class="dot w"></span>Da rivedere: <b id="review">0</b></span>
  </div>

  <div class="stage">
    <div class="card" id="card">
      <div class="face front">
        <img id="photo" alt="Foto persona" draggable="false">
        <div class="hint">Tocca per scoprire il nome</div>
      </div>
      <div class="face back">
        <img class="thumb" id="thumb" alt="">
        <div class="who">Si chiama</div>
        <div class="name" id="name">—</div>
        <div class="num" id="num"></div>
      </div>
    </div>
  </div>

  <div class="judge">
    <button class="no"  id="btnNo"  title="Non lo sapevo">↻ Da rivedere</button>
    <button class="yes" id="btnYes" title="Lo sapevo">✓ Lo so</button>
  </div>

  <div class="controls">
    <button id="prev">← Indietro</button>
    <button id="flip" class="primary">Gira</button>
    <button id="next">Avanti →</button>
  </div>

  <div class="modes">
    <button data-mode="all" class="active">Tutte (100)</button>
    <button data-mode="review">Solo da rivedere</button>
    <button id="shuffle">🔀 Mescola</button>
  </div>

  <div class="empty" id="empty">
    <p class="celebrate">🎉 Perfetto!</p>
    <p>Non hai nessuna carta da rivedere.</p>
  </div>

  <button class="reset" id="reset">Azzera progressi</button>

  <div class="kbd">
    <span>Spazio</span> gira &nbsp;·&nbsp; <span>←</span> <span>→</span> naviga &nbsp;·&nbsp; <span>↑</span> lo so &nbsp;·&nbsp; <span>↓</span> da rivedere
  </div>

<script src="data.js"></script>
<script>
(function(){
  const LS_KEY = "flashcard_nomi_v1";
  const $ = id => document.getElementById(id);

  // stato salvato (puo fallire su alcuni browser in locale: gestito)
  let saved = {};
  try{ saved = JSON.parse(localStorage.getItem(LS_KEY)) || {}; }catch(e){ saved = {}; }
  function persist(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(saved)); }catch(e){} }

  const all = PEOPLE.slice();
  let order = all.map((_,i)=>i);   // indici in "all", eventualmente mescolati
  let mode = "all";
  let deck = order.slice();        // mazzo attivo (filtrato per modalita)
  let pos = 0;

  const card=$("card"), photo=$("photo"), thumb=$("thumb"),
        nameEl=$("name"), numEl=$("num");

  function statusOf(i){ return saved[all[i].id]; } // "known" | "review" | undefined

  function rebuildDeck(keepCurrent){
    const curGlobal = deck.length ? deck[pos] : null;
    if(mode==="review"){
      deck = order.filter(i => statusOf(i)==="review");
    }else{
      deck = order.slice();
    }
    if(keepCurrent && curGlobal!==null){
      const np = deck.indexOf(curGlobal);
      pos = np>=0 ? np : 0;
    }else{
      pos = 0;
    }
    render();
  }

  function updateStats(){
    let k=0,r=0;
    all.forEach((p)=>{ if(saved[p.id]==="known")k++; else if(saved[p.id]==="review")r++; });
    $("known").textContent=k;
    $("review").textContent=r;
  }

  function render(){
    updateStats();
    const emptyBox=$("empty");
    if(deck.length===0){
      $("card").style.display="none";
      document.querySelector(".judge").style.display="none";
      document.querySelector(".controls").style.display="none";
      emptyBox.style.display="block";
      $("position").textContent="0 / 0";
      $("pbar").style.width="100%";
      return;
    }
    $("card").style.display="";
    document.querySelector(".judge").style.display="flex";
    document.querySelector(".controls").style.display="flex";
    emptyBox.style.display="none";

    if(pos<0)pos=deck.length-1;
    if(pos>=deck.length)pos=0;

    const gi = deck[pos];
    const person = all[gi];
    card.classList.remove("flipped");
    // precarico immagine
    photo.src = person.image;
    photo.alt = "Foto di una persona da riconoscere";
    thumb.src = person.image;
    nameEl.textContent = person.name;
    numEl.textContent = "#"+person.id+" di "+all.length;

    $("position").textContent = (pos+1)+" / "+deck.length;
    $("pbar").style.width = (((pos+1)/deck.length)*100)+"%";

    const st = saved[person.id];
    $("btnYes").classList.toggle("active", st==="known");
    $("btnNo").classList.toggle("active", st==="review");
  }

  function flip(){ card.classList.toggle("flipped"); }
  function go(d){ pos+=d; render(); }
  function mark(status){
    if(deck.length===0)return;
    const person = all[deck[pos]];
    saved[person.id]=status;
    persist();
    // in modalita "review", se la segno come "so" sparisce dal mazzo
    if(mode==="review" && status==="known"){
      rebuildDeck(false);
      // resta sulla stessa posizione (ora e' la prossima carta)
      if(pos>=deck.length)pos=0;
      render();
    }else{
      updateStats();
      setTimeout(()=>{ go(1); }, 180);
    }
  }

  function shuffle(){
    for(let i=order.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [order[i],order[j]]=[order[j],order[i]];
    }
    rebuildDeck(false);
  }

  // eventi
  card.addEventListener("click", flip);
  $("flip").addEventListener("click", flip);
  $("prev").addEventListener("click", ()=>go(-1));
  $("next").addEventListener("click", ()=>go(1));
  $("btnYes").addEventListener("click", ()=>mark("known"));
  $("btnNo").addEventListener("click", ()=>mark("review"));
  $("shuffle").addEventListener("click", shuffle);
  $("reset").addEventListener("click", ()=>{
    if(confirm("Azzerare tutti i progressi (So / Da rivedere)?")){
      saved={}; persist(); rebuildDeck(false);
    }
  });
  document.querySelectorAll(".modes button[data-mode]").forEach(b=>{
    b.addEventListener("click", ()=>{
      document.querySelectorAll(".modes button[data-mode]").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
      mode=b.dataset.mode;
      rebuildDeck(false);
    });
  });

  document.addEventListener("keydown",e=>{
    if(e.code==="Space"){e.preventDefault();flip();}
    else if(e.key==="ArrowRight")go(1);
    else if(e.key==="ArrowLeft")go(-1);
    else if(e.key==="ArrowUp"){e.preventDefault();mark("known");}
    else if(e.key==="ArrowDown"){e.preventDefault();mark("review");}
  });

  render();
})();
</script>
</body>
</html>
