<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Ricorda i Nomi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* Restrained, warm paper neutrals + one quiet accent (OKLCH) */
    --paper:    oklch(0.975 0.008 85);
    --surface:  oklch(0.995 0.005 85);
    --ink:      oklch(0.30 0.018 65);
    --muted:    oklch(0.57 0.012 68);
    --faint:    oklch(0.72 0.010 72);
    --line:     oklch(0.905 0.010 80);
    --accent:   oklch(0.58 0.085 40);   /* quiet terracotta, used sparingly */
    --good:     oklch(0.60 0.055 150);  /* muted sage, status only */
    --warn:     oklch(0.70 0.085 72);   /* muted amber, status only */
    --shadow:   0 1px 2px oklch(0.30 0.02 65 / .05), 0 22px 50px oklch(0.30 0.02 65 / .10);
    --serif: "Newsreader", Georgia, "Times New Roman", serif;
    --sans: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  :root[data-theme="dark"], :root:not([data-theme="light"]){}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:   oklch(0.205 0.012 68);
      --surface: oklch(0.245 0.012 68);
      --ink:     oklch(0.935 0.010 85);
      --muted:   oklch(0.70 0.012 80);
      --faint:   oklch(0.55 0.012 75);
      --line:    oklch(0.32 0.012 68);
      --accent:  oklch(0.70 0.075 45);
      --good:    oklch(0.70 0.055 150);
      --warn:    oklch(0.76 0.085 76);
      --shadow:  0 1px 2px oklch(0 0 0 / .3), 0 24px 54px oklch(0 0 0 / .45);
    }
  }
  :root[data-theme="dark"]{
    --paper:   oklch(0.205 0.012 68);
    --surface: oklch(0.245 0.012 68);
    --ink:     oklch(0.935 0.010 85);
    --muted:   oklch(0.70 0.012 80);
    --faint:   oklch(0.55 0.012 75);
    --line:    oklch(0.32 0.012 68);
    --accent:  oklch(0.70 0.075 45);
    --good:    oklch(0.70 0.055 150);
    --warn:    oklch(0.76 0.085 76);
    --shadow:  0 1px 2px oklch(0 0 0 / .3), 0 24px 54px oklch(0 0 0 / .45);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans);
    background:var(--paper);
    color:var(--ink);
    min-height:100%;
    display:flex;flex-direction:column;align-items:center;
    padding:clamp(20px,5vh,56px) 20px 48px;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* ---------- header ---------- */
  header{text-align:center;margin-bottom:clamp(20px,4vh,40px)}
  h1{
    font-family:var(--serif);font-weight:400;font-size:clamp(1.9rem,6vw,2.5rem);
    letter-spacing:-.01em;line-height:1;
  }
  .sub{color:var(--muted);font-size:.92rem;margin-top:10px;max-width:38ch;line-height:1.5}

  /* ---------- progress / counter ---------- */
  .meta{width:100%;max-width:340px;margin:0 auto}
  .counter{
    display:flex;align-items:baseline;justify-content:space-between;
    margin-bottom:12px;color:var(--muted);
  }
  .counter .pos{font-family:var(--serif);font-size:1.05rem;color:var(--ink);font-variant-numeric:tabular-nums}
  .counter .pos b{font-weight:500}
  .counter .tot{font-size:.82rem;letter-spacing:.02em}
  .track{height:2px;background:var(--line);border-radius:999px;overflow:hidden}
  .track>i{display:block;height:100%;width:0;background:var(--accent);
    transition:width .6s cubic-bezier(.16,1,.3,1)}

  /* ---------- stage / card ---------- */
  .stage{perspective:1800px;width:100%;max-width:340px;margin:clamp(22px,4vh,34px) auto 0}
  .card{
    position:relative;width:100%;aspect-ratio:3/4;
    transform-style:preserve-3d;cursor:pointer;
    transition:transform .62s cubic-bezier(.16,1,.3,1);
    border-radius:18px;
  }
  .card.flipped{transform:rotateY(180deg)}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:6px;border-radius:20px}
  .face{
    position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:18px;overflow:hidden;background:var(--surface);
    border:1px solid var(--line);box-shadow:var(--shadow);
  }
  .front img{width:100%;height:100%;object-fit:cover;display:block;background:var(--line)}

  .back{
    transform:rotateY(180deg);background:var(--surface);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:30px 24px;gap:18px;
  }
  .back .thumb{
    width:72px;height:72px;border-radius:50%;object-fit:cover;
    border:1px solid var(--line);
  }
  .back .label{
    font-family:var(--serif);font-style:italic;font-size:.95rem;color:var(--accent);
  }
  .back .name{
    font-family:var(--serif);font-weight:500;font-size:clamp(1.7rem,7vw,2.15rem);
    line-height:1.12;letter-spacing:-.01em;color:var(--ink);text-wrap:balance;
  }
  .back .num{
    font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
    margin-top:2px;
  }

  .cue{
    text-align:center;color:var(--faint);font-size:.82rem;margin-top:16px;
    letter-spacing:.01em;min-height:1.2em;transition:opacity .3s ease;
  }

  /* ---------- judge ---------- */
  .judge{display:flex;gap:10px;max-width:340px;margin:22px auto 0;width:100%}
  .judge button{
    flex:1;font-family:var(--sans);font-size:.9rem;font-weight:500;cursor:pointer;
    padding:12px 10px;border-radius:12px;background:transparent;color:var(--ink);
    border:1px solid var(--line);
    transition:border-color .2s ease,color .2s ease,background .2s ease,transform .12s ease;
  }
  .judge button .ic{opacity:.7;margin-right:6px}
  .judge .yes:hover{border-color:var(--good);color:var(--good)}
  .judge .no:hover{border-color:var(--warn);color:var(--warn)}
  .judge button:active{transform:translateY(1px)}
  .judge .yes.on{background:color-mix(in oklch,var(--good) 12%,transparent);border-color:var(--good);color:var(--good)}
  .judge .no.on{background:color-mix(in oklch,var(--warn) 14%,transparent);border-color:var(--warn);color:var(--warn)}

  /* ---------- controls ---------- */
  .controls{display:flex;align-items:center;gap:8px;max-width:340px;margin:12px auto 0;width:100%}
  .controls button{
    font-family:var(--sans);font-size:.88rem;font-weight:500;cursor:pointer;
    border-radius:12px;padding:11px 12px;transition:background .2s ease,transform .12s ease,border-color .2s;
  }
  .controls .nav{
    flex:0 0 auto;width:46px;background:transparent;border:1px solid var(--line);color:var(--muted);
  }
  .controls .nav:hover{color:var(--ink);border-color:var(--faint)}
  .controls .flip{
    flex:1;background:var(--ink);color:var(--paper);border:1px solid var(--ink);font-weight:600;
  }
  .controls .flip:hover{background:color-mix(in oklch,var(--ink) 88%,var(--accent))}
  .controls button:active{transform:translateY(1px)}

  /* ---------- footer row: stats + modes ---------- */
  .foot{max-width:340px;width:100%;margin:28px auto 0;
    display:flex;flex-direction:column;align-items:center;gap:16px}
  .stats{display:flex;gap:18px;font-size:.82rem;color:var(--muted)}
  .stats span{display:inline-flex;align-items:center;gap:7px}
  .stats b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
  .dot{width:7px;height:7px;border-radius:50%}
  .dot.g{background:var(--good)} .dot.w{background:var(--warn)}

  .modes{display:flex;gap:4px;align-items:center}
  .modes button{
    font-family:var(--sans);background:transparent;border:none;cursor:pointer;
    color:var(--muted);font-size:.84rem;padding:6px 10px;border-radius:999px;
    transition:color .2s ease,background .2s ease;
  }
  .modes button:hover{color:var(--ink)}
  .modes button.active{color:var(--ink);background:color-mix(in oklch,var(--ink) 7%,transparent)}
  .modes .sep{width:1px;height:16px;background:var(--line)}

  .reset{background:none;border:none;color:var(--faint);font-size:.78rem;cursor:pointer;
    margin-top:6px;text-underline-offset:3px}
  .reset:hover{color:var(--muted);text-decoration:underline}

  .kbd{color:var(--faint);font-size:.74rem;text-align:center;margin-top:22px;line-height:1.9}
  .kbd b{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}

  .empty{display:none;text-align:center;max-width:340px;margin:10px auto 0}
  .empty .mark{font-family:var(--serif);font-size:2.4rem;color:var(--good);line-height:1}
  .empty h2{font-family:var(--serif);font-weight:400;font-size:1.4rem;margin:12px 0 6px}
  .empty p{color:var(--muted);font-size:.9rem}

  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}

  @media (prefers-reduced-motion: reduce){
    .card{transition:none}
    .track>i{transition:none}
  }
</style>
</head>
<body>
  <header>
    <h1>Ricorda i Nomi</h1>
    <p class="sub">Guarda il volto, prova a ricordare il nome, poi gira la carta.</p>
  </header>

  <div class="meta">
    <div class="counter">
      <span class="pos"><b id="posNum">1</b></span>
      <span class="tot" id="posTot">di 100</span>
    </div>
    <div class="track"><i id="pbar"></i></div>
  </div>

  <div class="stage">
    <div class="card" id="card" tabindex="0" role="button" aria-label="Carta: tocca per scoprire il nome">
      <div class="face front">
        <img id="photo" alt="Volto di una persona da riconoscere" draggable="false">
      </div>
      <div class="face back">
        <img class="thumb" id="thumb" alt="" draggable="false">
        <div class="label">si chiama</div>
        <div class="name" id="name">—</div>
        <div class="num" id="num"></div>
      </div>
    </div>
  </div>

  <p class="cue" id="cue">Tocca la carta per girarla</p>

  <div class="judge">
    <button class="no"  id="btnNo"  title="Non lo ricordavo (freccia giù)"><span class="ic">↻</span>Da rivedere</button>
    <button class="yes" id="btnYes" title="Lo sapevo (freccia su)"><span class="ic">✓</span>Lo so</button>
  </div>

  <div class="controls">
    <button class="nav" id="prev" title="Precedente (←)" aria-label="Precedente">←</button>
    <button class="flip" id="flip">Gira la carta</button>
    <button class="nav" id="next" title="Successiva (→)" aria-label="Successiva">→</button>
  </div>

  <div class="foot">
    <div class="stats" aria-live="polite">
      <span><span class="dot g"></span>So <b id="known">0</b></span>
      <span><span class="dot w"></span>Da rivedere <b id="review">0</b></span>
    </div>
    <div class="modes">
      <button data-mode="all" class="active">Tutte</button>
      <span class="sep"></span>
      <button data-mode="review">Solo da rivedere</button>
      <span class="sep"></span>
      <button id="shuffle">Mescola</button>
    </div>
    <button class="reset" id="reset">Azzera progressi</button>
  </div>

  <div class="empty" id="empty">
    <div class="mark">✓</div>
    <h2>Le sai tutte</h2>
    <p>Non è rimasta nessuna carta da rivedere.</p>
  </div>

  <div class="kbd">
    <b>Spazio</b> gira · <b>←</b> <b>→</b> naviga · <b>↑</b> lo so · <b>↓</b> da rivedere
  </div>

<script src="data.js"></script>
<script>
(function(){
  const LS_KEY = "flashcard_nomi_v1";
  const $ = id => document.getElementById(id);

  let saved = {};
  try{ saved = JSON.parse(localStorage.getItem(LS_KEY)) || {}; }catch(e){ saved = {}; }
  function persist(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(saved)); }catch(e){} }

  const all = (typeof PEOPLE !== "undefined" ? PEOPLE : []).slice();
  let order = all.map((_,i)=>i);
  let mode = "all";
  let deck = order.slice();
  let pos = 0;

  const card=$("card"), photo=$("photo"), thumb=$("thumb"),
        nameEl=$("name"), numEl=$("num"), cue=$("cue");

  function statusOf(i){ return saved[all[i].id]; }

  function rebuildDeck(keepCurrent){
    const curGlobal = deck.length ? deck[pos] : null;
    deck = (mode==="review")
      ? order.filter(i => statusOf(i)==="review")
      : order.slice();
    if(keepCurrent && curGlobal!==null){
      const np = deck.indexOf(curGlobal);
      pos = np>=0 ? np : 0;
    }else{ pos = 0; }
    render();
  }

  function updateStats(){
    let k=0,r=0;
    all.forEach(p=>{ if(saved[p.id]==="known")k++; else if(saved[p.id]==="review")r++; });
    $("known").textContent=k; $("review").textContent=r;
  }

  function setCue(){
    if(deck.length===0){ cue.style.opacity=0; return; }
    cue.style.opacity=1;
    cue.textContent = card.classList.contains("flipped")
      ? "Tocca per tornare al volto"
      : "Tocca la carta per girarla";
  }

  function render(){
    updateStats();
    const flipped = false;
    if(deck.length===0){
      $("card").style.display="none";
      document.querySelector(".judge").style.display="none";
      document.querySelector(".controls").style.display="none";
      cue.style.opacity=0;
      $("empty").style.display="block";
      $("posNum").textContent="0"; $("posTot").textContent="di 0";
      $("pbar").style.width="100%";
      return;
    }
    $("card").style.display="";
    document.querySelector(".judge").style.display="flex";
    document.querySelector(".controls").style.display="flex";
    $("empty").style.display="none";

    if(pos<0)pos=deck.length-1;
    if(pos>=deck.length)pos=0;

    const person = all[deck[pos]];
    card.classList.remove("flipped");
    photo.src = person.image;
    thumb.src = person.image;
    nameEl.textContent = person.name;
    numEl.textContent = "n. "+person.id+" di "+all.length;

    $("posNum").textContent = (pos+1);
    $("posTot").textContent = "di "+deck.length;
    $("pbar").style.width = (((pos+1)/deck.length)*100)+"%";

    const st = saved[person.id];
    $("btnYes").classList.toggle("on", st==="known");
    $("btnNo").classList.toggle("on", st==="review");
    setCue();
  }

  function flip(){ card.classList.toggle("flipped"); setCue(); }
  function go(d){ pos+=d; render(); }

  function mark(status){
    if(deck.length===0)return;
    const person = all[deck[pos]];
    saved[person.id]=status; persist();
    if(mode==="review" && status==="known"){
      rebuildDeck(false);
      if(pos>=deck.length)pos=0;
      render();
    }else{
      updateStats();
      setTimeout(()=>go(1), 170);
    }
  }

  function shuffle(){
    for(let i=order.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [order[i],order[j]]=[order[j],order[i]];
    }
    rebuildDeck(false);
  }

  card.addEventListener("click", flip);
  card.addEventListener("keydown", e=>{
    if(e.code==="Space"||e.key==="Enter"){e.preventDefault();flip();}
  });
  $("flip").addEventListener("click", flip);
  $("prev").addEventListener("click", ()=>go(-1));
  $("next").addEventListener("click", ()=>go(1));
  $("btnYes").addEventListener("click", ()=>mark("known"));
  $("btnNo").addEventListener("click", ()=>mark("review"));
  $("shuffle").addEventListener("click", shuffle);
  $("reset").addEventListener("click", ()=>{
    if(confirm("Azzerare tutti i progressi (So / Da rivedere)?")){
      saved={}; persist(); rebuildDeck(false);
    }
  });
  document.querySelectorAll(".modes button[data-mode]").forEach(b=>{
    b.addEventListener("click", ()=>{
      document.querySelectorAll(".modes button[data-mode]").forEach(x=>x.classList.remove("active"));
      b.classList.add("active"); mode=b.dataset.mode; rebuildDeck(false);
    });
  });
  document.addEventListener("keydown",e=>{
    if(e.target===card && (e.code==="Space"||e.key==="Enter")) return;
    if(e.code==="Space"){e.preventDefault();flip();}
    else if(e.key==="ArrowRight")go(1);
    else if(e.key==="ArrowLeft")go(-1);
    else if(e.key==="ArrowUp"){e.preventDefault();mark("known");}
    else if(e.key==="ArrowDown"){e.preventDefault();mark("review");}
  });

  render();
})();
</script>
</body>
</html>
